[package]
name = "lnurl-wallet-native"
version = "0.0.0-dev" # stamped from the git tag on release, see scripts/set-version.sh
edition = "2021"
description = "Native desktop wallet for LNURLcash (LUD-25) bearer notes, built on lnurlcash-core"
license = "MIT"

[dependencies]
# 0.2.0, pinned by rev: early 0.x tracking a draft spec, and not on crates.io yet
lnurlcash-core = { git = "https://github.com/lnurlcash/lnurlcash-core", rev = "bf0c932beae01ecaef604024b96bf66ca86034b1" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
directories = "6"
qrcode = { version = "0.14", default-features = false }
anyhow = "1"
hex = "0.4"
# same version lnurlcash-core uses, for the bearer note's taproot key
secp256k1 = "0.29"
sha2 = "0.10"
bip39 = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[profile.release]
strip = true
lto = "thin"
